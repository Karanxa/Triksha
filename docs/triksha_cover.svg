<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    
    <!-- Shield gradient -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Circuit pattern -->
    <pattern id="circuit" patternUnits="userSpaceOnUse" width="100" height="100">
      <path d="M10 10 L40 10 M50 10 L90 10 M10 50 L30 50 M60 50 L90 50" 
            stroke="#3b82f6" stroke-width="1" opacity="0.1" fill="none"/>
      <circle cx="40" cy="10" r="3" fill="#3b82f6" opacity="0.15"/>
      <circle cx="50" cy="10" r="3" fill="#3b82f6" opacity="0.15"/>
      <circle cx="30" cy="50" r="3" fill="#3b82f6" opacity="0.15"/>
      <circle cx="60" cy="50" r="3" fill="#3b82f6" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#circuit)"/>
  
  <!-- Decorative lines -->
  <line x1="0" y1="100" x2="300" y2="100" stroke="url(#accentGradient)" stroke-width="2" opacity="0.3"/>
  <line x1="900" y1="530" x2="1200" y2="530" stroke="url(#accentGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- Neural network nodes (left side) -->
  <g opacity="0.4">
    <circle cx="100" cy="200" r="8" fill="#3b82f6"/>
    <circle cx="100" cy="280" r="8" fill="#3b82f6"/>
    <circle cx="100" cy="360" r="8" fill="#3b82f6"/>
    <circle cx="100" cy="440" r="8" fill="#3b82f6"/>
    
    <circle cx="200" cy="240" r="8" fill="#8b5cf6"/>
    <circle cx="200" cy="320" r="8" fill="#8b5cf6"/>
    <circle cx="200" cy="400" r="8" fill="#8b5cf6"/>
    
    <!-- Connections -->
    <line x1="100" y1="200" x2="200" y2="240" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="200" x2="200" y2="320" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="280" x2="200" y2="240" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="280" x2="200" y2="320" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="280" x2="200" y2="400" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="360" x2="200" y2="320" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="360" x2="200" y2="400" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="440" x2="200" y2="400" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Neural network nodes (right side) -->
  <g opacity="0.4">
    <circle cx="1100" cy="200" r="8" fill="#3b82f6"/>
    <circle cx="1100" cy="280" r="8" fill="#3b82f6"/>
    <circle cx="1100" cy="360" r="8" fill="#3b82f6"/>
    <circle cx="1100" cy="440" r="8" fill="#3b82f6"/>
    
    <circle cx="1000" cy="240" r="8" fill="#8b5cf6"/>
    <circle cx="1000" cy="320" r="8" fill="#8b5cf6"/>
    <circle cx="1000" cy="400" r="8" fill="#8b5cf6"/>
    
    <!-- Connections -->
    <line x1="1100" y1="200" x2="1000" y2="240" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="1100" y1="200" x2="1000" y2="320" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="1100" y1="280" x2="1000" y2="240" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="1100" y1="280" x2="1000" y2="320" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="1100" y1="280" x2="1000" y2="400" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="1100" y1="360" x2="1000" y2="320" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="1100" y1="360" x2="1000" y2="400" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="1100" y1="440" x2="1000" y2="400" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Central Shield Icon -->
  <g transform="translate(600, 200)">
    <!-- Outer glow -->
    <ellipse cx="0" cy="50" rx="80" ry="20" fill="#3b82f6" opacity="0.2" filter="url(#glow)"/>
    
    <!-- Shield shape -->
    <path d="M0 -80 L70 -50 L70 30 Q70 80 0 120 Q-70 80 -70 30 L-70 -50 Z" 
          fill="url(#shieldGradient)" filter="url(#glow)"/>
    
    <!-- Inner shield detail -->
    <path d="M0 -60 L50 -35 L50 20 Q50 60 0 90 Q-50 60 -50 20 L-50 -35 Z" 
          fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
    
    <!-- AI brain icon inside shield -->
    <g transform="translate(0, 10)">
      <!-- Brain outline -->
      <ellipse cx="0" cy="-10" rx="30" ry="25" fill="none" stroke="#ffffff" stroke-width="2"/>
      <!-- Neural connections inside -->
      <circle cx="-15" cy="-15" r="5" fill="#ffffff"/>
      <circle cx="15" cy="-15" r="5" fill="#ffffff"/>
      <circle cx="0" cy="5" r="5" fill="#ffffff"/>
      <circle cx="-10" cy="-5" r="3" fill="#ffffff" opacity="0.7"/>
      <circle cx="10" cy="-5" r="3" fill="#ffffff" opacity="0.7"/>
      <line x1="-15" y1="-15" x2="-10" y2="-5" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="15" y1="-15" x2="10" y2="-5" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="-10" y1="-5" x2="0" y2="5" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="10" y1="-5" x2="0" y2="5" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="-15" y1="-15" x2="0" y2="5" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
      <line x1="15" y1="-15" x2="0" y2="5" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="600" y="380" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" 
        fill="#ffffff" text-anchor="middle" letter-spacing="8">TRIKSHA</text>
  
  <!-- Tagline -->
  <text x="600" y="430" font-family="Arial, Helvetica, sans-serif" font-size="24" 
        fill="#94a3b8" text-anchor="middle" letter-spacing="2">SECURING AI WITH AI</text>
  
  <!-- Subtitle -->
  <text x="600" y="480" font-family="Arial, Helvetica, sans-serif" font-size="18" 
        fill="#64748b" text-anchor="middle">Contextual Adversarial Red Teaming for GenAI Applications</text>
  
  <!-- Accent corners -->
  <path d="M0 0 L80 0 L80 4 L4 4 L4 80 L0 80 Z" fill="url(#accentGradient)" opacity="0.5"/>
  <path d="M1200 630 L1120 630 L1120 626 L1196 626 L1196 550 L1200 550 Z" fill="url(#accentGradient)" opacity="0.5"/>
</svg>

